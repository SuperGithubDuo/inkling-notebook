<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Scripts only from this origin; connections only to this origin, the sync server and the AI server (filled in by the build). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' %INKLING_CONNECT_SRC%; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Inkling: handwritten notes with an AI tutor. Think it, ink it, master it." />
    <meta name="theme-color" content="#ffffff" />
    <meta name="referrer" content="no-referrer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Inkling" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Inkling</title>
  </head>
  <body>
    <!-- Shown until the app has loaded its storage and account; replaced when it starts. -->
    <div id="root">
      <div role="status" style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font: 14px system-ui, sans-serif; color: #8a8f9c">
        <img src="./icon.svg" alt="" width="56" height="56" />
        <p id="boot-status" style="margin: 0">Opening Inkling…</p>
      </div>
    </div>
    <noscript>Inkling needs JavaScript to run.</noscript>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
