name: Beta AI server

# Deploys Inkling's free cloud AI server (beta-server/) to Cloudflare and tests
# it against the REAL model (@cf/qwen/qwen3.8-27b), from GitHub's runners:
#   1. security checks on the deployed server (scripts/abuse-check.mjs security);
#   2. the real-model test, anonymously, as a freshly installed app;
#   3. usage-limit checks on a TEMPORARY copy of the server with tiny limits
#      (installation, network, per-minute, one-at-a-time, global cap under a
#      burst, pause), deleted again at the end.
# Anyone may use the deployed server without an account; see beta-server/README.md.
#
# Start it by pushing the branch `deploy/beta-server` (works from any branch,
# without touching main), or Actions → Beta AI server → Run workflow once this
# file is on the default branch.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_ACCOUNT_ID   your account ID (dashboard → Workers & Pages → right-hand column)
#   CLOUDFLARE_API_TOKEN    a token with: Account › Workers Scripts: Edit,
#                           Account › Account Settings: Read, Account › Billing: Read,
#                           Account › Workers AI: Read, User › Memberships: Read,
#                           User › User Details: Read
#   INKLING_ADMIN_TOKEN     a long random string (≥ 32 characters): the operator's
#                           summary and emergency pause (no user accounts exist)
#
# It refuses to deploy to an account on Workers Paid (where usage beyond the free
# allowance is billed) unless that is explicitly confirmed.

on:
  workflow_dispatch:
    inputs:
      live_test:
        description: Run the real-model and usage-limit tests after deploying (uses ~1,500–2,500 of today's 10,000 free Neurons)
        type: boolean
        default: true
  push:
    branches: ['deploy/beta-server']

permissions:
  contents: read

concurrency:
  group: beta-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INKLING_ADMIN_TOKEN: ${{ secrets.INKLING_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            beta-server/package-lock.json

      - name: Required secrets
        shell: bash
        run: |
          missing=()
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ ${#INKLING_ADMIN_TOKEN} -ge 32 ] || missing+=("INKLING_ADMIN_TOKEN (at least 32 characters)")
          if [ ${#missing[@]} -gt 0 ]; then echo "::error title=Missing secrets::Add these repository secrets: ${missing[*]} (see the top of .github/workflows/beta-server.yml)"; exit 1; fi

      - name: Check the Cloudflare plan (free usage only)
        shell: bash
        env:
          CONFIRMED: ${{ vars.INKLING_ACCOUNT_PLAN_CONFIRMED }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          v=$(api /user/tokens/verify | jq -r '.result.status // "invalid"')
          [ "$v" = active ] || { echo "::error title=Cloudflare token::The API token is not valid (status: $v)."; exit 1; }
          subs=$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/subscriptions")
          if [ "$(echo "$subs" | jq -r '.success')" != true ]; then
            msg=$(echo "$subs" | jq -r '[.errors[]?.message] | join("; ")')
            if [ "$CONFIRMED" = workers-free ]; then
              echo "::warning title=Cloudflare plan::Could not read the account's subscriptions ($msg); continuing because INKLING_ACCOUNT_PLAN_CONFIRMED=workers-free."
            else
              echo "::error title=Cloudflare plan::Could not check whether the account is on Workers Free ($msg). Give the token 'Account › Billing: Read', or set the repository variable INKLING_ACCOUNT_PLAN_CONFIRMED=workers-free after checking the plan yourself."
              exit 1
            fi
          else
            plans=$(echo "$subs" | jq -r '[.result[]? | "\(.rate_plan.id // "?") (\(.rate_plan.public_name // .product.name // "?"))"] | join(", ")')
            echo "::notice title=Cloudflare plan::Account subscriptions: ${plans:-none (free plans only)}"
            if echo "$subs" | jq -e '[.result[]? | (.rate_plan.id // "" | ascii_upcase) | select(test("WORKERS") and (test("FREE") | not))] | length > 0' >/dev/null; then
              if [ "$CONFIRMED" != workers-paid-ok ]; then
                echo "::error title=Cloudflare plan::This account is on a paid Workers plan, where AI usage beyond the free allowance is billed. Deploy to an account on Workers Free, or set INKLING_ACCOUNT_PLAN_CONFIRMED=workers-paid-ok to accept paid usage (the server's own cap still stops at 9,000 Neurons a day)."
                exit 1
              fi
              echo "::warning title=Cloudflare plan::Workers Paid account accepted by INKLING_ACCOUNT_PLAN_CONFIRMED."
            fi
          fi

      # The server shares Inkling's request schema and tutor prompts (src/shared, src/main/ai), which
      # import packages from the app's own node_modules: install both.
      - name: Install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm --prefix beta-server ci

      - name: Typecheck the server
        working-directory: beta-server
        run: node ../scripts/ci-run.mjs "beta-server typecheck" npm run typecheck

      - name: Deploy
        id: deploy
        working-directory: beta-server
        shell: bash
        run: |
          # Cloudflare's API occasionally fails with a transient internal error (code 10500): try up to 3 times.
          for attempt in 1 2 3; do
            if node ../scripts/ci-run.mjs "wrangler deploy" npx wrangler deploy > /tmp/deploy.log 2>&1; then break; fi
            cat /tmp/deploy.log
            [ $attempt = 3 ] && exit 1
            echo "::warning title=wrangler deploy::attempt $attempt failed; retrying in 20 s"
            sleep 20
          done
          cat /tmp/deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          [ -n "$url" ] || { echo "::error title=Deploy::Deployed, but no workers.dev address was printed. Open Workers & Pages in the Cloudflare dashboard once to create your workers.dev subdomain."; exit 1; }
          # Trailing whitespace from pasting the secret would make the token unusable in a header.
          token=$(printf '%s' "$INKLING_ADMIN_TOKEN" | tr -d '\r\n')
          printf '%s' "$token" | npx wrangler secret put ADMIN_TOKEN > /tmp/secret.log 2>&1 || { echo "::error title=set ADMIN_TOKEN::$(tr '\n' ' ' < /tmp/secret.log)"; exit 1; }
          echo "::notice title=set ADMIN_TOKEN::$(grep -v '^\s*$' /tmp/secret.log | tail -3 | tr '\n' ' ')"
          # A new secret takes a few seconds to reach the running Worker.
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$url/admin/summary" -H "Authorization: Bearer $token")
            [ "$code" = 200 ] && break
            sleep 4
          done
          if [ "$code" != 200 ]; then
            echo "::error title=Admin token::The admin API still answers $code two minutes after setting ADMIN_TOKEN. Check that the INKLING_ADMIN_TOKEN secret is 32–200 characters on one line, without spaces."
            exit 1
          fi
          echo "::notice title=Admin token::accepted by the server after $((i * 4)) s"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=AI server deployed::$url  (set this as the repository variable INKLING_BETA_URL to build it into the app)"

      - name: Security checks on the deployed server
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          ADMIN=$(printf '%s' "$INKLING_ADMIN_TOKEN" | tr -d '\r\n')
          for i in $(seq 1 20); do body=$(curl -sS "$URL/" || true); [[ "$body" == *"Inkling AI server"* ]] && break; sleep 3; done
          [[ "$body" == *"Inkling AI server"* ]] || { echo "::error title=Deployed server::$URL did not answer as expected: $body"; exit 1; }
          # The emergency pause must be off for the public.
          curl -sS -X POST "$URL/admin/pause" -H "Authorization: Bearer $ADMIN" -H 'content-type: application/json' -d '{"paused":false}' >/dev/null
          node scripts/abuse-check.mjs security "$URL"
          echo "::notice title=AI server today::$(curl -sS "$URL/admin/summary" -H "Authorization: Bearer $ADMIN")"

      - name: Live test against the real model (anonymous, as a fresh install)
        if: github.event_name == 'push' || inputs.live_test
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
          INKLING_LIVE_PROBE: '1'
        run: |
          ADMIN=$(printf '%s' "$INKLING_ADMIN_TOKEN" | tr -d '\r\n')
          day_start=$(date -u +%Y-%m-%dT00:00:00Z)
          echo "day_start=$day_start" >> "$GITHUB_ENV"
          before=$(node scripts/cf-neurons.mjs "$day_start")
          echo "::notice title=Cloudflare-counted Neurons today before the tests::$before"
          t0=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          INKLING_BETA_URL="$URL" INKLING_LIVE_CLOUD=1 node scripts/ci-run.mjs "live cloud test" npm run test:live:cloud
          status=$?
          set -e
          node scripts/live-summary.mjs
          echo "::notice title=AI server after the live test::$(curl -sS "$URL/admin/summary" -H "Authorization: Bearer $ADMIN")"
          exit $status

      - name: Usage-limit checks on a temporary server with tiny limits
        if: github.event_name == 'push' || inputs.live_test
        working-directory: beta-server
        shell: bash
        env:
          NAME: inkling-ai-limits-test
        run: |
          ADMIN=$(printf '%s' "$INKLING_ADMIN_TOKEN" | tr -d '\r\n')
          export INKLING_ADMIN_TOKEN="$ADMIN"
          # Same code and model as production; separate ledger; only the limits differ.
          common=(--name "$NAME" --var NETWORK_CONCURRENT:20 --var GLOBAL_CONCURRENT:20)
          deploy() {
            for attempt in 1 2 3; do
              npx wrangler deploy "${common[@]}" "$@" > /tmp/limits-deploy.log 2>&1 && break
              [ $attempt = 3 ] && { echo "::error title=Temporary server::$(tail -5 /tmp/limits-deploy.log | tr '\n' ' ')"; exit 1; }
              sleep 20
            done
            url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/limits-deploy.log | head -1)
          }
          # Ready once the admin API answers with the limits just deployed (a new version takes a moment to reach every location).
          ready() {
            for i in $(seq 1 45); do
              got=$(curl -sS "$url/admin/summary" -H "Authorization: Bearer $ADMIN" | jq -c "[.limits.networkDailyNeurons, .limits.globalDailyNeurons, .limits.installPerMinute]" 2>/dev/null || true)
              [ "$got" = "$1" ] && { sleep 10; return 0; }
              sleep 4
            done
            echo "::error title=Temporary server::$url did not start serving limits $1 (got $got)"; exit 1
          }
          fail=0
          deploy --var INSTALL_DAILY_NEURONS:120 --var NETWORK_DAILY_NEURONS:100000 --var NETWORK_PER_MINUTE:6 --var GLOBAL_DAILY_NEURONS:1500
          printf '%s' "$ADMIN" | npx wrangler secret put ADMIN_TOKEN --name "$NAME" > /dev/null 2>&1
          ready '[100000,1500,6]'
          echo "::notice title=Temporary server::$url"
          node ../scripts/abuse-check.mjs limits "$url" 1 || fail=1
          deploy --var NETWORK_DAILY_NEURONS:300 --var NETWORK_PER_MINUTE:100 --var GLOBAL_DAILY_NEURONS:1500 --var INSTALL_PER_MINUTE:2
          ready '[300,1500,2]'
          node ../scripts/abuse-check.mjs limits "$url" 2 || fail=1
          used=$(curl -sS "$url/admin/summary" -H "Authorization: Bearer $ADMIN" | jq -r .globalUsed)
          cap=$((used + 400))
          deploy --var NETWORK_DAILY_NEURONS:100000 --var NETWORK_PER_MINUTE:100 --var GLOBAL_DAILY_NEURONS:$cap
          ready "[100000,$cap,6]"
          node ../scripts/abuse-check.mjs limits "$url" 3 || fail=1
          exit $fail

      - name: Delete the temporary server
        if: always()
        working-directory: beta-server
        shell: bash
        run: |
          # Through the API (force: also removes its Durable Object data).
          res=$(curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/inkling-ai-limits-test?force=true")
          if [ "$(echo "$res" | jq -r .success)" = true ]; then
            echo "::notice title=Temporary server::deleted"
          elif echo "$res" | jq -e '[.errors[]?.code] | index(10007)' >/dev/null; then
            echo "::notice title=Temporary server::none to delete"
          else
            echo "::warning title=Temporary server::could not delete inkling-ai-limits-test: $(echo "$res" | jq -c .errors)"
          fi

      - name: Cloudflare's own count of today's Neurons
        if: always() && (github.event_name == 'push' || inputs.live_test)
        shell: bash
        run: |
          # Analytics lag a few minutes.
          sleep 240
          echo "::notice title=Cloudflare-counted Neurons today after all tests::$(node scripts/cf-neurons.mjs "${day_start:-$(date -u +%Y-%m-%dT00:00:00Z)}")"

      - name: Confirm the account is still on Workers Free
        if: always()
        shell: bash
        run: |
          subs=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/subscriptions")
          plans=$(echo "$subs" | jq -r 'if .success then ([.result[]? | "\(.rate_plan.id // "?") (\(.rate_plan.public_name // .product.name // "?"))"] | join(", ")) else "could not read: \([.errors[]?.message] | join("; "))" end')
          echo "::notice title=Cloudflare plan after the test::Account subscriptions: ${plans:-none (free plans only)}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-cloud-report
          path: test-results/live-cloud-*
          if-no-files-found: ignore
