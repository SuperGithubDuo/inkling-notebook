name: Release

# Builds Inkling's installers on real Windows and macOS machines and tests them.
#
# How to start it (see docs/RELEASING.md):
# - Push any branch named build/<something>: `build/windows` builds Windows,
#   `build/macos` builds macOS, `build/all` (or any other name) builds both.
#   Works from any branch, including beta-release, without touching main.
# - Actions → Release → Run workflow (only once this file is on the default
#   branch: GitHub lists manual workflows from the default branch only).
# - Push a tag v* to also upload the installers to a DRAFT GitHub release.
#   Drafts are private until someone presses Publish.
#
# Nothing is published by branch builds or manual runs: installers are kept as
# workflow artifacts. Signing switches on when the signing secrets exist.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which installers to build
        type: choice
        options: [windows, macos, both]
        default: windows
  push:
    branches: ['build/**']
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - id: plan
        shell: bash
        run: |
          want=both
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then want="${{ inputs.platforms }}"; fi
          case "$GITHUB_REF_NAME" in *win*) want=windows ;; *mac*) want=macos ;; esac
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then want=both; fi
          case "$want" in
            windows) m='["windows-2022"]' ;;
            macos) m='["macos-15"]' ;;
            *) m='["windows-2022","macos-15"]' ;;
          esac
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "publish=always" >> "$GITHUB_OUTPUT"; else echo "publish=never" >> "$GITHUB_OUTPUT"; fi
          echo "Building for: $m"

  checks:
    name: Checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/ci-run.mjs typecheck npm run typecheck
      - run: node scripts/ci-run.mjs "unit tests" npm test
      - run: node scripts/ci-run.mjs build npm run build
      - name: Beta server (Cloudflare Worker) typecheck and bundle
        working-directory: beta-server
        run: |
          npm ci
          node ../scripts/ci-run.mjs "beta-server typecheck" npm run typecheck
          node ../scripts/ci-run.mjs "beta-server bundle" npx wrangler deploy --dry-run --outdir /tmp/beta-bundle

  installers:
    name: Installer (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      # The cloud AI beta server built into the app, and where feedback goes (repository variables, not secrets).
      MAIN_VITE_INKLING_BETA_URL: ${{ vars.INKLING_BETA_URL }}
      MAIN_VITE_INKLING_FEEDBACK_URL: ${{ vars.INKLING_FEEDBACK_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/ci-run.mjs "unit tests" npm test
      - name: Signing credentials
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # Only non-empty secrets are passed on: electron-builder treats an empty CSC_LINK as a certificate.
          put() { if [ -n "$2" ]; then { echo "$1<<__EOF__"; echo "$2"; echo "__EOF__"; } >> "$GITHUB_ENV"; fi; }
          signed=no
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CSC_LINK" ]; then
            signed=yes; put CSC_LINK "$MAC_CSC_LINK"; put CSC_KEY_PASSWORD "$MAC_CSC_KEY_PASSWORD"
            put APPLE_ID "$APPLE_ID"; put APPLE_APP_SPECIFIC_PASSWORD "$APPLE_APP_SPECIFIC_PASSWORD"; put APPLE_TEAM_ID "$APPLE_TEAM_ID"
          fi
          if [ "$RUNNER_OS" = Windows ] && [ -n "$WIN_CSC_LINK" ]; then
            signed=yes; put CSC_LINK "$WIN_CSC_LINK"; put CSC_KEY_PASSWORD "$WIN_CSC_KEY_PASSWORD"
          fi
          [ "$RUNNER_OS" = macOS ] && [ "$signed" = no ] && echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          echo "SIGNED=$signed" >> "$GITHUB_ENV"
          # Self-installing updates only for signed builds; unsigned betas only say that a new version exists.
          if [ "$signed" = yes ]; then echo "MAIN_VITE_INKLING_UPDATE_MODE=auto" >> "$GITHUB_ENV"; else echo "MAIN_VITE_INKLING_UPDATE_MODE=notify" >> "$GITHUB_ENV"; fi
          if [ "$signed" = yes ]; then echo "::notice title=Signing::Signed build"; else echo "::warning title=Signing::Unsigned build: for testers only (security prompts on first open)"; fi
          if [ -n "$MAIN_VITE_INKLING_BETA_URL" ]; then echo "::notice title=Cloud AI::Built with the beta server $MAIN_VITE_INKLING_BETA_URL"; else echo "::warning title=Cloud AI::No INKLING_BETA_URL variable: this build has no cloud AI server built in"; fi
      - run: node scripts/ci-run.mjs build npm run build
      - name: Check the cloud AI server address is built in
        if: vars.INKLING_BETA_URL != ''
        shell: bash
        run: |
          if grep -qF "$MAIN_VITE_INKLING_BETA_URL" out/main/index.js; then
            echo "::notice title=Cloud AI address built in::out/main/index.js contains $MAIN_VITE_INKLING_BETA_URL"
          else
            echo "::error title=Cloud AI address missing::The build does not contain $MAIN_VITE_INKLING_BETA_URL"; exit 1
          fi
      - run: node scripts/ci-run.mjs "licence notices" node scripts/notices.mjs
      - name: Build installers
        shell: bash
        run: |
          args=(--publish "${{ needs.plan.outputs.publish }}")
          if [ "$RUNNER_OS" = Windows ]; then args+=(--win); else args+=(--mac); fi
          if [ "$RUNNER_OS" = macOS ] && [ "$SIGNED" = yes ] && [ -n "${APPLE_ID:-}" ]; then args+=(-c.mac.notarize=true); fi
          # Unsigned Mac builds are signed ad hoc (Apple silicon won't run unsigned code). Ad-hoc
          # signatures can't satisfy the hardened runtime's library validation, so it is off for them.
          if [ "$RUNNER_OS" = macOS ] && [ "$SIGNED" = no ]; then args+=(-c.mac.identity=- -c.mac.hardenedRuntime=false); fi
          node scripts/ci-run.mjs "electron-builder" npx electron-builder "${args[@]}"
          ls -la release
      - name: Smoke-test the packaged app
        shell: bash
        env:
          # With a server built in, the test also checks that cloud AI is the default and reachable.
          INKLING_EXPECT_BETA_URL: ${{ vars.INKLING_BETA_URL }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then app=release/win-unpacked/Inkling.exe; else app=release/mac-arm64/Inkling.app/Contents/MacOS/Inkling; fi
          INKLING_PACKAGED_APP="$app" node scripts/ci-run.mjs "packaged app" node tests/e2e/packaged.e2e.mjs
      - name: Install, update, uninstall, reinstall (notebooks must survive)
        shell: bash
        env:
          INKLING_EXPECT_BETA_URL: ${{ vars.INKLING_BETA_URL }}
        run: |
          # A second build with a higher version stands in for "the next update".
          next="$(node -p "require('./package.json').version").ci${GITHUB_RUN_NUMBER}"
          if [ "$RUNNER_OS" = Windows ]; then plat=--win; else plat=--mac; fi
          extra=()
          if [ "$RUNNER_OS" = macOS ] && [ "$SIGNED" = no ]; then extra+=(-c.mac.identity=- -c.mac.hardenedRuntime=false); fi
          node scripts/ci-run.mjs "electron-builder (next version)" npx electron-builder $plat --publish never -c.extraMetadata.version="$next" -c.directories.output=release-next "${extra[@]}"
          # Start from a clean profile: the smoke test above already used this machine's Inkling folder.
          if [ "$RUNNER_OS" = Windows ]; then rm -rf "$APPDATA/Inkling"; a=$(ls release/Inkling-Setup-*.exe | head -1); b=$(ls release-next/Inkling-Setup-*.exe | head -1)
          else rm -rf "$HOME/Library/Application Support/Inkling"; a=$(ls release/Inkling-*-arm64.dmg | head -1); b=$(ls release-next/Inkling-*-arm64.dmg | head -1); fi
          node scripts/ci-run.mjs "installer lifecycle" node tests/e2e/installer.e2e.mjs "$a" "$b"
      # The installer on its own, so testers download just the .exe (or .dmg).
      - name: Upload the installer
        id: installer
        uses: actions/upload-artifact@v4
        with:
          name: Inkling-${{ runner.os }}-installer
          path: |
            release/Inkling-Setup-*.exe
            release/Inkling-*.dmg
          if-no-files-found: error
      - name: Report the download link
        shell: bash
        env:
          LINK: ${{ steps.installer.outputs.artifact-url }}
        run: |
          hash() { if command -v sha256sum >/dev/null; then sha256sum "$1" | cut -d' ' -f1; else shasum -a 256 "$1" | cut -d' ' -f1; fi; }
          sums=$(cd release && for f in Inkling-Setup-*.exe Inkling-*.dmg; do if [ -f "$f" ]; then echo "$f SHA-256 $(hash "$f")"; fi; done)
          echo "::notice title=Installer download (${{ runner.os }})::$LINK%0A$(echo "$sums" | sed ':a;N;$!ba;s/\n/%0A/g')"
      - uses: actions/upload-artifact@v4
        with:
          name: inkling-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-installer-${{ runner.os }}
          path: test-results
          if-no-files-found: ignore

  acceptance:
    name: Acceptance (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/ci-run.mjs build npm run build
      # Each suite separately, so one failure doesn't hide the others.
      - { name: Phase 1, if: always(), run: node scripts/ci-run.mjs "phase1" node tests/e2e/phase1.e2e.mjs }
      - { name: Phase 2, if: always(), run: node scripts/ci-run.mjs "phase2" node tests/e2e/phase2.e2e.mjs }
      - { name: Regressions, if: always(), run: node scripts/ci-run.mjs "regressions" node tests/e2e/regressions.e2e.mjs }
      - { name: Phase 3, if: always(), run: node scripts/ci-run.mjs "phase3" node tests/e2e/phase3.e2e.mjs }
      - { name: Phase 4 (Gemini), if: always(), run: node scripts/ci-run.mjs "phase4" node tests/e2e/phase4.e2e.mjs }
      - { name: Ollama, if: always(), run: node scripts/ci-run.mjs "ollama" node tests/e2e/ollama.e2e.mjs }
      - { name: Cloud beta, if: always(), run: node scripts/ci-run.mjs "cloud" node tests/e2e/cloud.e2e.mjs }
      - { name: Layout, if: always(), run: node scripts/ci-run.mjs "layout" node tests/e2e/layout.e2e.mjs }
      - { name: Release, if: always(), run: node scripts/ci-run.mjs "release" node tests/e2e/release.e2e.mjs }
      - { name: Large notebook, if: always(), run: node scripts/ci-run.mjs "perf" node tests/e2e/perf.e2e.mjs }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-acceptance-${{ runner.os }}
          path: test-results
          if-no-files-found: ignore
