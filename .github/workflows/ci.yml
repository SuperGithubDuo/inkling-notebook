name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Typecheck, unit tests and the build don't run Electron itself, so
      # scripts/ensure-electron.mjs (postinstall) skips the ~100 MB download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            beta-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The cloud beta server (Cloudflare Worker): typecheck and a bundle dry run. Nothing is deployed.
      - run: npm ci
        working-directory: beta-server
      - run: npm run typecheck
        working-directory: beta-server
      - run: npx wrangler deploy --dry-run --outdir /tmp/beta-bundle
        working-directory: beta-server
