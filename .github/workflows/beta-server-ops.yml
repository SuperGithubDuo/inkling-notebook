name: AI server emergency switch

# Operator tools for Inkling's free AI server (they need the INKLING_ADMIN_TOKEN
# secret, which never leaves GitHub). Same as `npm run admin -- summary|pause|resume`
# in beta-server/.
#
# Start one with Actions → AI server emergency switch → Run workflow, choosing:
#   summary  → usage (no identities): dollars or Neurons used in the last 24 h,
#                  today's use, monthly budget/remaining, answers and pause state. Read-only.
#   pause    → stop ALL AI answers now. The app says the AI is paused for
#                  maintenance; notebooks work as usual.
#   resume   → turn AI answers back on.
# Fallback: push a branch ops/summary, ops/pause or ops/resume (delete it afterwards).

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [summary, pause, resume]
        default: summary
  push:
    branches: ['ops/pause', 'ops/resume', 'ops/summary']

permissions:
  contents: read

concurrency:
  group: beta-server-ops
  cancel-in-progress: false

jobs:
  switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pause, resume or summarize
        shell: bash
        env:
          URL: ${{ vars.INKLING_BETA_URL }}
          INKLING_ADMIN_TOKEN: ${{ secrets.INKLING_ADMIN_TOKEN }}
          # Run workflow passes the choice; a pushed ops/<action> branch names it.
          ACTION: ${{ inputs.action || github.ref_name }}
        run: |
          ACTION=${ACTION#ops/}
          case "$ACTION" in summary|pause|resume) ;; *) echo "::error title=AI server::Unknown action '$ACTION'."; exit 1 ;; esac
          [ -n "$URL" ] || { echo "::error title=AI server::Set the repository variable INKLING_BETA_URL first."; exit 1; }
          ADMIN=$(printf '%s' "$INKLING_ADMIN_TOKEN" | tr -d '\r\n')
          [ ${#ADMIN} -ge 32 ] || { echo "::error title=AI server::The INKLING_ADMIN_TOKEN secret is missing or too short."; exit 1; }
          if [ "$ACTION" != summary ]; then
            if [ "$ACTION" = pause ]; then paused=true; else paused=false; fi
            code=$(curl -sS -o /tmp/res.json -w '%{http_code}' -X POST "$URL/admin/pause" -H "Authorization: Bearer $ADMIN" -H 'content-type: application/json' -d "{\"paused\":$paused}")
            [ "$code" = 200 ] || { echo "::error title=AI server switch::The server answered $code."; exit 1; }
            # Check the current notice-4 app and old apps without the notice header.
            for notice in 4 legacy; do
              headers=(-H 'x-inkling-install: inst_operatorstatuscheck000000')
              [ "$notice" = legacy ] || headers+=(-H "x-inkling-notice: $notice")
              code=$(curl -sS -o /tmp/status.json -w '%{http_code}' "$URL/v1/status" "${headers[@]}")
              [ "$code" = 200 ] || { echo "::error title=AI server switch::Status ($notice) answered $code."; exit 1; }
              now=$(jq -r .paused /tmp/status.json)
              [ "$now" = "$paused" ] || { echo "::error title=AI server switch::Asked for paused=$paused but the server reports $now ($notice)."; exit 1; }
            done
            echo "::notice title=AI server switch::AI answers are now $([ "$paused" = true ] && echo PAUSED || echo ON) at $URL"
          fi
          # Today's totals (UTC day), after any switch. Counts only: no identities or content.
          code=$(curl -sS -o /tmp/sum.json -w '%{http_code}' "$URL/admin/summary" -H "Authorization: Bearer $ADMIN")
          [ "$code" = 200 ] || { echo "::error title=AI usage::The server answered $code."; exit 1; }
          line=$(node beta-server/scripts/usage-summary.mjs < /tmp/sum.json)
          echo "::notice title=AI usage today::$line"
          { echo "### Inkling AI usage"; echo; echo "$line"; echo; echo '```json'; jq . /tmp/sum.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
