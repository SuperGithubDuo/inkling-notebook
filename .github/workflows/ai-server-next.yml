name: AI server (external provider, test)

# Deploys a SEPARATE test copy of Inkling's AI server, "inkling-ai-next"
# (beta-server/wrangler.external.jsonc), that answers through DeepInfra instead of
# Workers AI, and checks it against the real provider. The production server
# ("inkling-ai-beta", Workers AI), its secrets and its workflow are not touched.
#
# Start it by pushing the branch `deploy/ai-server-next` (works before this file is on
# the default branch), or Actions → Run workflow once it is.
#
# Steps: unit tests · direct DeepInfra probes (streaming, thinking switch, real image
# tokens, error statuses, a 20-request burst) · deploy the test Worker · the notice gate
# and the security checks · the 13 real-model scenarios (quality, latency, tokens, cost)
# · a temporary copy with a tiny dollar cap hit by a burst of concurrent long requests,
# deleted afterwards. Costs a few cents on the development key's DeepInfra account.
#
# Needs these repository secrets:
#   CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN   as for the production workflow
#   INKLING_ADMIN_TOKEN                           ≥ 32 characters (the test Workers' admin API)
#   DEEPINFRA_DEV_API_KEY                         a DeepInfra key for DEVELOPMENT (not production)

on:
  workflow_dispatch:
    inputs:
      live_test:
        description: Run the real-model scenarios (13 answers; a few cents)
        type: boolean
        default: true
  push:
    branches: ['deploy/ai-server-next']

permissions:
  contents: read

concurrency:
  group: ai-server-next
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INKLING_ADMIN_TOKEN: ${{ secrets.INKLING_ADMIN_TOKEN }}
      DEEPINFRA_DEV_API_KEY: ${{ secrets.DEEPINFRA_DEV_API_KEY }}
      LIVE: ${{ github.event_name == 'push' || inputs.live_test }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            beta-server/package-lock.json

      - name: Required secrets
        shell: bash
        run: |
          missing=()
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ ${#INKLING_ADMIN_TOKEN} -ge 32 ] || missing+=("INKLING_ADMIN_TOKEN (at least 32 characters)")
          [ -n "$DEEPINFRA_DEV_API_KEY" ] || missing+=(DEEPINFRA_DEV_API_KEY)
          if [ ${#missing[@]} -gt 0 ]; then echo "::error title=Missing secrets::Add these repository secrets: ${missing[*]} (see the top of .github/workflows/ai-server-next.yml)"; exit 1; fi

      - name: Install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm --prefix beta-server ci
          mkdir -p test-results

      - name: Typecheck and unit-test the server
        run: |
          npm --prefix beta-server run typecheck
          npx vitest run tests/unit/provider.test.ts tests/unit/beta.test.ts

      - name: Direct DeepInfra probes
        shell: bash
        run: |
          INFERENCE_API_KEY=$(printf '%s' "$DEEPINFRA_DEV_API_KEY" | tr -d '\r\n') node beta-server/scripts/deepinfra-probe.mjs test-results/deepinfra-probe.md
          cat test-results/deepinfra-probe.md >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy the test Worker
        id: deploy
        working-directory: beta-server
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx wrangler deploy -c wrangler.external.jsonc > /tmp/deploy.log 2>&1; then break; fi
            cat /tmp/deploy.log
            [ $attempt = 3 ] && exit 1
            sleep 20
          done
          cat /tmp/deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          [ -n "$url" ] || { echo "::error title=Deploy::no workers.dev address printed"; exit 1; }
          # Secrets go in through stdin; they never appear in the log.
          printf '%s' "$DEEPINFRA_DEV_API_KEY" | tr -d '\r\n' | npx wrangler secret put INFERENCE_API_KEY -c wrangler.external.jsonc > /dev/null 2>&1 || { echo "::error title=INFERENCE_API_KEY::could not be set"; exit 1; }
          token=$(printf '%s' "$INKLING_ADMIN_TOKEN" | tr -d '\r\n')
          printf '%s' "$token" | npx wrangler secret put ADMIN_TOKEN -c wrangler.external.jsonc > /dev/null 2>&1 || { echo "::error title=ADMIN_TOKEN::could not be set"; exit 1; }
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$url/admin/summary" -H "Authorization: Bearer $token")
            [ "$code" = 200 ] && break
            sleep 4
          done
          [ "$code" = 200 ] || { echo "::error title=Admin token::admin API answers $code"; exit 1; }
          # The provider key is read on the first request; wait until the Worker is configured.
          for i in $(seq 1 30); do
            s=$(curl -sS "$url/v1/status" -H "x-inkling-install: inst_$(openssl rand -hex 16)")
            echo "$s" | grep -q '"qwen3.8-27b"' && break
            sleep 4
          done
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Test AI server deployed::$url (DeepInfra; production untouched)"

      - name: Notice gate and security checks
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          ADMIN=$(printf '%s' "$INKLING_ADMIN_TOKEN" | tr -d '\r\n')
          curl -sS -X POST "$URL/admin/pause" -H "Authorization: Bearer $ADMIN" -H 'content-type: application/json' -d '{"paused":false}' >/dev/null
          # An app with the old (Cloudflare-only) notice is refused before anything reaches DeepInfra.
          code=$(curl -sS -o /tmp/old.json -w '%{http_code}' -X POST "$URL/v1/tutor" -H 'content-type: application/json' -H "x-inkling-install: inst_$(openssl rand -hex 16)" -d '{"task":"chat","turns":[{"role":"user","parts":[{"text":"hi"}]}]}')
          [ "$code" = 400 ] && grep -q update_required /tmp/old.json || { echo "::error title=Notice gate::an app without notice 4 got $code: $(cat /tmp/old.json)"; exit 1; }
          echo "::notice title=Notice gate::an app on notice 3 is refused (400 update_required)"
          node scripts/abuse-check.mjs security "$URL" | tee test-results/security.txt
          echo "::notice title=Test AI server after security checks::$(curl -sS "$URL/admin/summary" -H "Authorization: Bearer $ADMIN" | jq -c '{unit, globalUsed, globalLimit, monthUsed, monthLimit, answers}')"

      - name: Real-model scenarios (quality, latency, cost)
        if: env.LIVE == 'true'
        shell: bash
        env:
          INKLING_BETA_URL: ${{ steps.deploy.outputs.url }}
          INKLING_LIVE_CLOUD: '1'
          INKLING_LIVE_UNIT: usd
        run: |
          set +e
          npm run test:live:cloud
          status=$?
          set -e
          ADMIN=$(printf '%s' "$INKLING_ADMIN_TOKEN" | tr -d '\r\n')
          echo "::notice title=Test AI server after the scenarios::$(curl -sS "$INKLING_BETA_URL/admin/summary" -H "Authorization: Bearer $ADMIN" | jq -c '{unit, globalUsed, monthUsed, answers}')"
          exit $status

      - name: Spending cap under concurrency (temporary Worker, tiny cap)
        if: (success() || failure()) && steps.deploy.outputs.url != ''
        working-directory: beta-server
        shell: bash
        env:
          NAME: inkling-ai-next-caps
        run: |
          ADMIN=$(printf '%s' "$INKLING_ADMIN_TOKEN" | tr -d '\r\n')
          export INKLING_ADMIN_TOKEN="$ADMIN"
          # Same code and provider; separate ledger; a $0.01 day; network limits opened up so the
          # whole burst (one runner IP) reaches the global cap.
          vars=(--name "$NAME" --var GLOBAL_DAILY_USD:0.01 --var GLOBAL_MONTHLY_USD:1 --var NETWORK_DAILY_USD:1 --var INSTALL_DAILY_USD:0.02 --var NETWORK_CONCURRENT:32 --var GLOBAL_CONCURRENT:32 --var NETWORK_PER_MINUTE:100 --var SOFT_LIMIT_FRACTION:1)
          for attempt in 1 2 3; do
            npx wrangler deploy -c wrangler.external.jsonc "${vars[@]}" > /tmp/caps.log 2>&1 && break
            [ $attempt = 3 ] && { echo "::error title=Temporary server::$(tail -5 /tmp/caps.log | tr '\n' ' ')"; exit 1; }
            sleep 20
          done
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/caps.log | head -1)
          printf '%s' "$DEEPINFRA_DEV_API_KEY" | tr -d '\r\n' | npx wrangler secret put INFERENCE_API_KEY --name "$NAME" > /dev/null 2>&1
          printf '%s' "$ADMIN" | npx wrangler secret put ADMIN_TOKEN --name "$NAME" > /dev/null 2>&1
          ok=0
          for i in $(seq 1 60); do
            got=$(curl -sS "$url/admin/summary" -H "Authorization: Bearer $ADMIN" | jq -c '[.unit, .limits.globalDailyNeurons, .limits.networkConcurrent]' 2>/dev/null || true)
            if [ "$got" = '["usd",10000,32]' ]; then ok=$((ok + 1)); else ok=0; fi
            [ $ok -ge 5 ] && break
            sleep 3
          done
          [ $ok -ge 5 ] || { echo "::error title=Temporary server::$url not serving the tiny cap (got $got)"; exit 1; }
          sleep 10
          node scripts/cap-check.mjs "$url" daily ../test-results/cap-check.md

      - name: Delete the temporary Worker
        if: always()
        shell: bash
        run: |
          res=$(curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/inkling-ai-next-caps?force=true")
          if [ "$(echo "$res" | jq -r .success)" = true ]; then echo "::notice title=Temporary Worker::deleted"; else echo "::warning title=Temporary Worker::$(echo "$res" | jq -c .errors)"; fi

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-server-next-reports
          path: |
            test-results/*.md
            test-results/*.json
            test-results/*.txt
          if-no-files-found: ignore
