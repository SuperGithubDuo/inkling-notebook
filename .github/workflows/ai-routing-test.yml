name: AI routing test (temporary Worker)

# Tests text-only routing (beta-server/src/route.ts) on a TEMPORARY copy of the AI
# server, "inkling-ai-routing-test", with Gemma 4 26B A4B answering practice
# generation only (TEXT_MODEL_TASKS=practice). Production ("inkling-ai-beta"),
# its ledger, settings and secrets are untouched; the temporary Worker is deleted
# at the end, whatever happens.
#
#   1. unit tests and the server typecheck;
#   2. a Neuron budget check: today's use + this run must leave production at least
#      5,000 of the free 10,000 (Workers Free fails rather than bills either way);
#   3. deploy the temporary Worker with routing on;
#   4. security checks on it (scripts/abuse-check.mjs security);
#   5. the complete live suite through the app's AiService, anonymously, as a fresh
#      install: the 13 original answers (50 checks), the text scenarios and the
#      practice-generation evaluations; then the operator summary must show practice,
#      and only practice, on Gemma;
#   6. the same practice evaluations on Qwen alone (AI server code on the runner,
#      Workers AI REST API), for the comparison;
#   7. the kill switch: redeploy with a text model that Workers Free refuses, check that
#      practice fails and nothing else does, then clear MODEL_TEXT and time how long
#      until practice is answered by Qwen again;
#   8. delete the Worker; Cloudflare's own Neuron counts per model.
#
# Start it by pushing the branch `deploy/ai-routing-test`.
# Secrets: CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, INKLING_ADMIN_TOKEN.

on:
  workflow_dispatch:
  push:
    branches: ['deploy/ai-routing-test']

permissions:
  contents: read

concurrency:
  group: ai-routing-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INKLING_ADMIN_TOKEN: ${{ secrets.INKLING_ADMIN_TOKEN }}
      NAME: inkling-ai-routing-test
      GEMMA: '@cf/google/gemma-4-26b-a4b-it'
      QWEN: '@cf/qwen/qwen3.8-27b'
      # What this run may spend in all, and what it must leave production today.
      PLANNED: '3300'
      PRODUCTION_RESERVE: '5000'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            beta-server/package-lock.json

      - name: Required secrets
        shell: bash
        run: |
          missing=()
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ ${#INKLING_ADMIN_TOKEN} -ge 32 ] || missing+=(INKLING_ADMIN_TOKEN)
          if [ ${#missing[@]} -gt 0 ]; then echo "::error title=Missing secrets::${missing[*]}"; exit 1; fi

      - name: Account is on Workers Free
        shell: bash
        run: |
          subs=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/subscriptions")
          echo "subscriptions: $(echo "$subs" | jq -c '[.result[]? | {plan: .rate_plan.id, price: .price}]')"
          if echo "$subs" | jq -e '[.result[]? | select((.price // 0) > 0 or ((.rate_plan.id // "" | ascii_upcase) | (test("WORKERS") and (test("FREE") | not))))] | length > 0' > /dev/null; then
            echo "::error title=Paid plan::not testing on a paid account"; exit 1
          fi

      - name: Install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm --prefix beta-server ci
          mkdir -p test-results

      - name: Unit tests and server typecheck
        run: |
          npm --prefix beta-server run typecheck
          npx vitest run

      - name: Neuron budget
        shell: bash
        run: |
          node scripts/cf-usage.mjs 30 > /tmp/usage.json
          [ "$(jq -r .ok /tmp/usage.json)" = true ] || { echo "::error title=Usage unknown::$(jq -r .error /tmp/usage.json)"; exit 1; }
          used=$(jq -r --arg d "$(date -u +%F)" '.utcDays[$d] // 0' /tmp/usage.json)
          echo "Workers AI today (UTC): $used Neurons; this run plans $PLANNED; production keeps at least $PRODUCTION_RESERVE"
          if [ $((used + PLANNED + PRODUCTION_RESERVE)) -gt 10000 ]; then echo "::error title=Neuron budget::$used used today + $PLANNED planned would leave production under $PRODUCTION_RESERVE"; exit 1; fi
          echo "start=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"

      - name: Deploy the temporary Worker (Gemma for practice only)
        id: deploy
        working-directory: beta-server
        shell: bash
        run: |
          ADMIN=$(printf '%s' "$INKLING_ADMIN_TOKEN" | tr -d '\r\n')
          for attempt in 1 2 3; do
            npx wrangler deploy --name "$NAME" --var "MODEL_TEXT:$GEMMA" --var TEXT_MODEL_TASKS:practice > /tmp/d.log 2>&1 && break
            cat /tmp/d.log; [ $attempt = 3 ] && exit 1; sleep 20
          done
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/d.log | head -1)
          grep -E 'MODEL_TEXT|TEXT_MODEL_TASKS' /tmp/d.log
          printf '%s' "$ADMIN" | npx wrangler secret put ADMIN_TOKEN --name "$NAME" > /dev/null 2>&1
          for i in $(seq 1 40); do [ "$(curl -sS -o /dev/null -w '%{http_code}' "$url/admin/summary" -H "Authorization: Bearer $ADMIN")" = 200 ] && break; sleep 3; done
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Temporary Worker: $url"

      - name: Security checks on the temporary Worker
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/abuse-check.mjs security "$URL"

      - name: Complete live suite on the temporary Worker (routing on)
        if: (success() || failure()) && steps.deploy.outputs.url != ''
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          ADMIN=$(printf '%s' "$INKLING_ADMIN_TOKEN" | tr -d '\r\n')
          set +e
          INKLING_BETA_URL="$URL" INKLING_LIVE_CLOUD=1 npm run test:live:cloud > test-results/live-routed.log 2>&1
          status=$?
          set -e
          grep -E '^\s+(\[|installation|Workers AI)|Tests |✓|×' test-results/live-routed.log | head -80
          LIVE_SUMMARY_TEXTS=1 node scripts/live-summary.mjs test-results/live-cloud-qwen3.8-27b.json
          s=$(curl -sS "$URL/admin/summary" -H "Authorization: Bearer $ADMIN")
          echo "$s" | jq '.models' | tee test-results/routed-models.json
          # Routing as configured: practice, and only practice, on Gemma; everything else on Qwen.
          echo "$s" | jq -e --arg g "$GEMMA" --arg q "$QWEN" '(.models.today[$g].tasks | keys) == ["practice"] and ((.models.today[$q].tasks.practice // 0) == 0) and (.models.today[$g].image == 0)' > /dev/null \
            && echo "ROUTING OK: practice only on Gemma, no images on Gemma" \
            || { echo "::error title=Routing::the summary does not show practice-only routing"; status=1; }
          exit $status

      - name: Practice evaluations on Qwen alone (comparison)
        if: success() || failure()
        shell: bash
        run: |
          set +e
          INKLING_LIVE_SCENARIOS=practice INKLING_LIVE_BUDGET=1400 npm run test:live:cloud > test-results/live-qwen-practice.log 2>&1
          grep -E '^\s+\[|Tests ' test-results/live-qwen-practice.log | head -20
          LIVE_SUMMARY_TEXTS=1 node scripts/live-summary.mjs test-results/live-cloud-qwen3.8-27b-practice.json
          exit 0

      - name: Kill switch (text model unavailable, then off)
        if: (success() || failure()) && steps.deploy.outputs.url != ''
        working-directory: beta-server
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set +e
          ADMIN=$(printf '%s' "$INKLING_ADMIN_TOKEN" | tr -d '\r\n')
          deploy() { for a in 1 2 3; do npx wrangler deploy --name "$NAME" "$@" > /tmp/k.log 2>&1 && return 0; sleep 15; done; cat /tmp/k.log; return 1; }
          # A model Workers Free refuses (error 5035, nothing charged) stands in for Gemma becoming unavailable.
          deploy --var MODEL_TEXT:@cf/zai-org/glm-5.3-flash --var TEXT_INPUT_NEURONS_PER_M:13636 --var TEXT_OUTPUT_NEURONS_PER_M:45455 --var TEXT_MODEL_TASKS:practice
          for i in $(seq 1 30); do
            r=$(node ../scripts/routing-killswitch.mjs "$URL" unavailable)
            [ "$(echo "$r" | jq -r .practice.answered)" = false ] && break; sleep 8
          done
          echo "UNAVAILABLE: $r"
          down_ok=$(echo "$r" | jq -r '(.practice.answered == false) and (.chat.answered == true)')
          # The switch: redeploy with wrangler.jsonc as it ships (MODEL_TEXT empty), exactly as a production rollback.
          t0=$(date +%s)
          deploy
          for i in $(seq 1 60); do
            r=$(node ../scripts/routing-killswitch.mjs "$URL" off)
            [ "$(echo "$r" | jq -r .practice.answered)" = true ] && break; sleep 8
          done
          t1=$(date +%s)
          echo "OFF: $r"
          up_ok=$(echo "$r" | jq -r '(.practice.answered == true) and (.chat.answered == true)')
          echo "KILL SWITCH: other tasks unaffected while unavailable: $down_ok; practice back on Qwen after clearing MODEL_TEXT: $up_ok, $((t1 - t0)) s from the start of the redeploy"
          curl -sS "$URL/admin/summary" -H "Authorization: Bearer $ADMIN" | jq -c '.models.today | to_entries | map({model: .key, requests: .value.requests, tasks: .value.tasks, errors: .value.errorKinds})'
          [ "$down_ok" = true ] && [ "$up_ok" = true ]

      - name: Delete the temporary Worker
        if: always()
        shell: bash
        run: |
          res=$(curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$NAME?force=true")
          echo "deleted: $(echo "$res" | jq -c '{success, errors}')"

      - name: Neurons as Cloudflare counted them
        if: always()
        shell: bash
        run: |
          sleep 240
          echo "CLOUDFLARE NEURONS since $start: $(node scripts/cf-neurons.mjs "${start:-$(date -u +%FT00:00:00Z)}")"
          echo "WORKERS AI BY UTC DAY: $(node scripts/cf-usage.mjs 30 | jq -c .utcDays)"
          subs=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/subscriptions")
          echo "subscriptions after: $(echo "$subs" | jq -c '[.result[]? | {plan: .rate_plan.id, price: .price}]')"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-routing-test
          path: test-results/
          if-no-files-found: ignore
