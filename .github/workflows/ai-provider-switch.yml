name: AI server - switch provider (production)

# Switches the PRODUCTION AI server ("inkling-ai-beta", same Worker, same URL, same users) between:
#   deepinfra   wrangler.deepinfra.jsonc: apps on data notice 4+ answered by DeepInfra (Qwen 3.8 27B),
#               $5/month and $0.25/day hard caps; older apps keep Workers AI (free) on the bridge.
#   workers-ai  wrangler.jsonc: everything on Workers AI Free, exactly as before (the rollback).
#
# It never runs on a push. Three manual gates, all required:
#   1. Someone with write access starts it: Actions → this workflow → Run workflow (the file must be
#      on the default branch, so the migration has to be merged first).
#   2. They type the exact confirmation phrase for the direction chosen:
#        deepinfra    →  switch production to deepinfra
#        workers-ai   →  switch production to workers-ai
#      Anything else stops the run before it touches Cloudflare.
#   3. The job runs in the GitHub environment "production-ai", and GitHub waits for a required
#      reviewer's "Approve and deploy". The first job (gate) refuses to go on unless production-ai
#      exists, has a required reviewer and only allows the default branch to deploy.
#
# Recovery: if anything fails or the run is cancelled once the key or the deploy step has started,
# production is redeployed with wrangler.jsonc (Workers AI, as before) and the result is verified
# from Cloudflare's own record of the deployed version and from the live server.
#
# After deploying it checks, without any model request: the provider, the dollar limits, that an app
# on notice 4 gets the DeepInfra allowance and an older app the Workers AI one. Then ONE short real
# answer on each path (well under a cent). If any check fails while switching to DeepInfra, it
# deploys wrangler.jsonc again (automatic rollback) and fails.
#
# Repository secrets: CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, INKLING_ADMIN_TOKEN (as for the
# Beta AI server workflow) and, for deepinfra, DEEPINFRA_API_KEY (the PRODUCTION DeepInfra key).

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Who answers in production
        type: choice
        options: [deepinfra, workers-ai]
        required: true
      confirm:
        description: 'Type exactly: switch production to <provider> (e.g. switch production to deepinfra)'
        type: string
        required: true

permissions:
  contents: read
  # environment-check.mjs reads the production-ai environment's protection rules.
  actions: read

concurrency:
  group: beta-server-production
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET: ${{ inputs.provider }}
      CONFIRM: ${{ inputs.confirm }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Manual confirmation
        shell: bash
        run: |
          [ "${{ github.event_name }}" = workflow_dispatch ] || { echo "::error title=Not allowed::only a manual run can switch production"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error title=Branch::production switches require main"; exit 1; }
          case "$TARGET" in deepinfra|workers-ai) ;; *) echo "::error title=Provider::unknown provider '$TARGET'"; exit 1 ;; esac
          [ "$CONFIRM" = "switch production to $TARGET" ] || { echo "::error title=Not confirmed::type exactly: switch production to $TARGET"; exit 1; }
          echo "::notice title=Confirmed::$GITHUB_ACTOR confirmed: switch production to $TARGET"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: The approval environment is configured
        run: node beta-server/scripts/environment-check.mjs production-ai

  switch:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # GitHub waits here for a required reviewer's approval.
    environment: production-ai
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INKLING_ADMIN_TOKEN: ${{ secrets.INKLING_ADMIN_TOKEN }}
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
      TARGET: ${{ inputs.provider }}
      CONFIRM: ${{ inputs.confirm }}
      # The production Worker's address (same as ai-routing-smoke.yml), known even if a deploy fails midway.
      URL: https://inkling-ai-beta.shenjonas9.workers.dev
    steps:
      - name: Manual confirmation (again, on the approved job)
        shell: bash
        run: |
          [ "${{ github.event_name }}" = workflow_dispatch ] && [ "$CONFIRM" = "switch production to $TARGET" ] || { echo "::error title=Not confirmed::"; exit 1; }

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            beta-server/package-lock.json

      - name: Required secrets
        shell: bash
        run: |
          missing=()
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ ${#INKLING_ADMIN_TOKEN} -ge 32 ] || missing+=("INKLING_ADMIN_TOKEN (at least 32 characters)")
          if [ "$TARGET" = deepinfra ] && [ -z "$(printf '%s' "$DEEPINFRA_API_KEY" | tr -d '\r\n ')" ]; then missing+=("DEEPINFRA_API_KEY (the production DeepInfra key)"); fi
          if [ ${#missing[@]} -gt 0 ]; then echo "::error title=Missing secrets::Add these secrets: ${missing[*]}"; exit 1; fi

      - name: Production provider before the switch
        id: before
        run: node beta-server/scripts/production-provider.mjs

      - name: Check the production DeepInfra key has credit
        if: env.TARGET == 'deepinfra'
        shell: bash
        run: |
          key=$(printf '%s' "$DEEPINFRA_API_KEY" | tr -d '\r\n')
          code=$(curl -sS -o /tmp/k.json -w '%{http_code}' https://api.deepinfra.com/v1/openai/chat/completions -H "Authorization: Bearer $key" -H 'content-type: application/json' \
            -d '{"model":"Qwen/Qwen3.8-27B","messages":[{"role":"user","content":"Reply with OK."}],"max_tokens":3,"chat_template_kwargs":{"enable_thinking":false}}')
          case "$code" in
            200) echo "::notice title=DeepInfra key::works and has credit" ;;
            401|403) echo "::error title=DeepInfra key::refused (HTTP $code): check the DEEPINFRA_API_KEY secret"; exit 1 ;;
            402) echo "::error title=DeepInfra key::no credit (HTTP 402): add prepaid credit to the production DeepInfra account"; exit 1 ;;
            *) echo "::error title=DeepInfra key::HTTP $code: $(head -c 300 /tmp/k.json)"; exit 1 ;;
          esac

      - name: Install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm --prefix beta-server ci

      - name: Typecheck and unit-test the server
        run: |
          npm --prefix beta-server run typecheck
          npx vitest run tests/unit/provider.test.ts tests/unit/beta.test.ts tests/unit/bridge.test.ts tests/unit/privacy.test.ts

      - name: Routing check on the real Worker, locally (older apps → Workers AI, notice 4 → DeepInfra)
        run: node beta-server/scripts/bridge-check.mjs wrangler.deepinfra.jsonc

      # From here on production may change: any failure or cancellation triggers recovery (last steps).
      - name: Set the DeepInfra key
        id: key
        if: env.TARGET == 'deepinfra'
        working-directory: beta-server
        shell: bash
        run: |
          # The key first, so the new version never runs without it (it would answer 503, never bill).
          printf '%s' "$DEEPINFRA_API_KEY" | tr -d '\r\n' | npx wrangler secret put INFERENCE_API_KEY -c wrangler.deepinfra.jsonc > /dev/null 2>&1 || { echo "::error title=INFERENCE_API_KEY::could not be set"; exit 1; }

      - name: Deploy
        id: deploy
        working-directory: beta-server
        shell: bash
        run: |
          cfg=wrangler.jsonc
          [ "$TARGET" = deepinfra ] && cfg=wrangler.deepinfra.jsonc
          for attempt in 1 2 3; do
            npx wrangler deploy -c "$cfg" > /tmp/deploy.log 2>&1 && break
            [ $attempt = 3 ] && { cat /tmp/deploy.log; exit 1; }
            sleep 20
          done
          echo "::notice title=Deployed::$cfg"

      - name: Verify
        id: verify
        shell: bash
        run: |
          # Cloudflare's record of the deployed version first, then the live server.
          node beta-server/scripts/production-provider.mjs --expect "$TARGET"
          ADMIN=$(printf '%s' "$INKLING_ADMIN_TOKEN" | tr -d '\r\n')
          new="inst_$(openssl rand -hex 16)"; old="inst_$(openssl rand -hex 16)"
          want=neurons; [ "$TARGET" = deepinfra ] && want=usd
          ok=0
          for i in $(seq 1 30); do
            s=$(curl -sS "$URL/admin/summary" -H "Authorization: Bearer $ADMIN")
            [ "$(echo "$s" | jq -r .unit)" = "$want" ] && { ok=1; break; }
            sleep 4
          done
          [ $ok = 1 ] || { echo "::error title=Verify::the server does not report unit $want: $s"; exit 1; }
          if [ "$TARGET" = deepinfra ]; then
            echo "$s" | jq -e '.monthLimit == 5000000 and .dailyConfigured == 250000' > /dev/null || { echo "::error title=Verify::dollar limits not as configured: $(echo "$s" | jq -c '{monthLimit, dailyConfigured, globalLimit}')"; exit 1; }
            q4=$(curl -sS "$URL/v1/status" -H "x-inkling-install: $new" -H 'x-inkling-notice: 4' | jq -c .quota)
            q3=$(curl -sS "$URL/v1/status" -H "x-inkling-install: $old" | jq -c .quota)
            echo "$q4" | jq -e '.installLimit == 10000' > /dev/null || { echo "::error title=Verify::notice-4 app did not get the DeepInfra allowance: $q4"; exit 1; }
            echo "$q3" | jq -e '.installLimit == 900' > /dev/null || { echo "::error title=Verify::older app did not get the Workers AI bridge: $q3"; exit 1; }
            ask() {
              local h=(-H 'content-type: application/json' -H "x-inkling-install: $1")
              [ -n "$2" ] && h+=(-H "x-inkling-notice: $2")
              curl -sS -X POST "$URL/v1/tutor" "${h[@]}" -d '{"task":"chat","turns":[{"role":"user","parts":[{"text":"In one short sentence: what is 7 x 8?"}]}]}'
            }
            a4=$(ask "$new" 4); a3=$(ask "$old" "")
            echo "$a4" | grep -q 'event: done' || { echo "::error title=Verify::DeepInfra answer failed: $(echo "$a4" | tail -c 300)"; exit 1; }
            echo "$a3" | grep -q 'event: done' || { echo "::error title=Verify::older-app answer failed: $(echo "$a3" | tail -c 300)"; exit 1; }
            echo "::notice title=Verify::DeepInfra answers notice-4 apps; older apps answered by Workers AI; limits \$5/month, \$0.25/day"
          else
            q=$(curl -sS "$URL/v1/status" -H "x-inkling-install: $old" | jq -c .quota)
            echo "$q" | jq -e '.installLimit == 900' > /dev/null || { echo "::error title=Verify::Workers AI allowance not served: $q"; exit 1; }
            echo "::notice title=Verify::Workers AI answers everyone"
          fi

      # ---- Recovery: runs on failure or cancellation once production may have changed (the key was
      # set, or the deploy started, even if it stopped midway), for either target.
      - name: Recover to Workers AI
        id: recover
        if: >-
          (failure() || cancelled()) &&
          (contains(fromJSON('["success","failure","cancelled"]'), steps.key.outcome) ||
           contains(fromJSON('["success","failure","cancelled"]'), steps.deploy.outcome))
        working-directory: beta-server
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npx wrangler deploy -c wrangler.jsonc > /tmp/recover.log 2>&1 && { echo "::warning title=Recovery::wrangler.jsonc deployed (attempt $attempt)"; exit 0; }
            sleep 15
          done
          tail -20 /tmp/recover.log
          echo "::error title=Recovery failed::could not deploy wrangler.jsonc. Pause answers now (Actions → AI server emergency switch → pause) and deploy by hand: cd beta-server && npx wrangler deploy"
          exit 1

      - name: Verify the recovery
        if: always() && steps.recover.outcome == 'success'
        shell: bash
        run: |
          ADMIN=$(printf '%s' "$INKLING_ADMIN_TOKEN" | tr -d '\r\n')
          fail() { echo "::error title=Recovery NOT verified::$1. Pause answers (Actions → AI server emergency switch → pause) and check by hand."; exit 1; }
          node beta-server/scripts/production-provider.mjs --expect workers-ai || fail "Cloudflare does not report the Workers AI configuration"
          ok=0
          for i in $(seq 1 30); do
            [ "$(curl -sS "$URL/admin/summary" -H "Authorization: Bearer $ADMIN" | jq -r .unit)" = neurons ] && { ok=1; break; }
            sleep 4
          done
          [ $ok = 1 ] || fail "the live server does not count in Neurons"
          for notice in "" 4; do
            h=(-H "x-inkling-install: inst_$(openssl rand -hex 16)"); [ -n "$notice" ] && h+=(-H "x-inkling-notice: $notice")
            st=$(curl -sS "$URL/v1/status" "${h[@]}")
            echo "$st" | jq -e '.quota.installLimit == 900 and .paused == false' > /dev/null || fail "status for notice '${notice:-none}': $(echo "$st" | head -c 200)"
          done
          echo "::warning title=Recovered::production runs Workers AI (wrangler.jsonc), verified on Cloudflare and on the live server; both app versions are served"
