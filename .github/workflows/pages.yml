name: Website and web app

# Builds the website (site/) with the web app (src/web, served at /app/) and, once switched on, deploys it to GitHub Pages.
#
# What it offers: scripts/site/build-site.mjs picks the newest PUBLISHED release that the
# Release workflow verified (hidden marker in its notes), whose tag points at the verified
# commit and whose installers still match the verified SHA-256. Drafts, "DO NOT PUBLISH"
# builds and tags listed in site/config.json → "withdrawn" are never offered. With nothing
# approved, the page says no download is available.
#
# When it runs: whenever a release is published, edited, unpublished or deleted (so the page
# follows your Publish click), when the site or its rules change on main, every 3 hours as a
# safety net, and by hand. Release events run the workflow file at the release's tag, so they
# only hand over to a fresh run on main ("relay"); everything is built and deployed from main.
#
# Switching it on (needs approval; see docs/RELEASING.md, "Download site"):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions".
# That setting is the switch: until it is chosen, the site is only built and checked.
# Kill switch: repository variable INKLING_SITE_ENABLED=false stops deploys.

on:
  release:
    types: [published, edited, unpublished, deleted, prereleased, released]
  push:
    branches: [main]
    paths: ['site/**', 'scripts/site/**', 'scripts/release/rules.mjs', '.github/workflows/pages.yml', 'src/**', 'vite.web.config.mts', 'package.json', 'package-lock.json']
  pull_request:
    paths: ['site/**', 'scripts/site/**', 'scripts/release/**', '.github/workflows/pages.yml', 'src/web/**', 'vite.web.config.mts']
  workflow_dispatch:
  schedule:
    - cron: '23 */3 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  relay:
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.mode }}
    steps:
      - name: Is GitHub Pages switched on (Source = GitHub Actions)?
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null) || mode=off
          case "$mode" in workflow|legacy) ;; *) mode=off ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = workflow ]; then echo "::notice title=Download site::Pages is on; this run deploys from main"
          else echo "::notice title=Download site::Pages is not set to GitHub Actions ($mode): building and checking only"; fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # The web app. These settings are public by design (a project URL and its anon key; what a signed-in
      # user can reach is decided by the database's row-level security). Never put a service-role key here.
      # Without them the app is still built and works signed-out, with no sync and no AI tutor.
      - name: Build the web app
        env:
          VITE_SUPABASE_URL: ${{ vars.INKLING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.INKLING_SUPABASE_ANON_KEY }}
          VITE_INKLING_BETA_URL: ${{ vars.INKLING_BETA_URL }}
          VITE_INKLING_FEEDBACK_URL: ${{ vars.INKLING_FEEDBACK_URL }}
        run: |
          npm run build:web
          [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ] || echo "::warning title=Web app::INKLING_SUPABASE_URL / INKLING_SUPABASE_ANON_KEY are not set: this build has no accounts or sync"
          [ -n "$VITE_INKLING_BETA_URL" ] || echo "::warning title=Web app::INKLING_BETA_URL is not set: this build has no AI tutor"
      - name: Choose the release and build the pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEEDBACK_URL: ${{ vars.INKLING_FEEDBACK_URL }}
        run: node scripts/site/build-site.mjs --out _site --app out/web
      - name: Check the page links only to verified installers
        run: node scripts/site/check-site.mjs _site
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.INKLING_SITE_ENABLED != 'false' && needs.build.outputs.pages == 'workflow'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
