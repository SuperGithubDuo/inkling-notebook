name: AI server (OpenRouter Free, test)

# Tests OpenRouter's FREE Qwen 3.8 27B endpoint (qwen/qwen3.8-27b:free) for Inkling:
# direct probes (endpoint metadata and data policy, the account's free counter and
# credits, streaming, reasoning switch, images, a long conversation, errors, the
# per-minute limit), then a SEPARATE test Worker "inkling-ai-free-next"
# (beta-server/wrangler.openrouter-free.jsonc) with the security checks and the 13
# real-model scenarios, then a temporary copy with a 5-request daily quota hit by a
# burst. Production ("inkling-ai-beta", Workers AI), its secrets and main are untouched.
# Free requests only (zero price ceiling); uses ~80 of the account's daily free requests.
#
# Start it by pushing the branch `deploy/ai-server-free`.
#
# Needs these repository secrets:
#   CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN   as for the production workflow
#   INKLING_ADMIN_TOKEN                           ≥ 32 characters
#   OPENROUTER_API_KEY                            an OpenRouter key for DEVELOPMENT

on:
  workflow_dispatch:
  push:
    branches: ['deploy/ai-server-free']

permissions:
  contents: read

concurrency:
  group: ai-server-free
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INKLING_ADMIN_TOKEN: ${{ secrets.INKLING_ADMIN_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            beta-server/package-lock.json

      - name: Required secrets
        shell: bash
        run: |
          missing=()
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ ${#INKLING_ADMIN_TOKEN} -ge 32 ] || missing+=("INKLING_ADMIN_TOKEN (at least 32 characters)")
          [ -n "$OPENROUTER_API_KEY" ] || missing+=(OPENROUTER_API_KEY)
          if [ ${#missing[@]} -gt 0 ]; then echo "::error title=Missing secrets::Add these repository secrets: ${missing[*]} (see the top of .github/workflows/ai-server-free.yml)"; exit 1; fi

      - name: Install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm --prefix beta-server ci
          mkdir -p test-results

      - name: Typecheck and unit-test the server
        run: |
          npm --prefix beta-server run typecheck
          npx vitest run tests/unit/openrouterFree.test.ts tests/unit/provider.test.ts tests/unit/beta.test.ts

      - name: Direct OpenRouter Free probes
        shell: bash
        run: |
          export OPENROUTER_API_KEY=$(printf '%s' "$OPENROUTER_API_KEY" | tr -d '\r\n')
          node beta-server/scripts/openrouter-free-probe.mjs test-results/openrouter-free-probe.md
          cat test-results/openrouter-free-probe.md >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy the test Worker
        id: deploy
        working-directory: beta-server
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx wrangler deploy -c wrangler.openrouter-free.jsonc > /tmp/deploy.log 2>&1; then break; fi
            cat /tmp/deploy.log; [ $attempt = 3 ] && exit 1; sleep 20
          done
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          [ -n "$url" ] || { echo "::error title=Deploy::no workers.dev address printed"; exit 1; }
          printf '%s' "$OPENROUTER_API_KEY" | tr -d '\r\n' | npx wrangler secret put INFERENCE_API_KEY -c wrangler.openrouter-free.jsonc > /dev/null 2>&1 || { echo "::error title=INFERENCE_API_KEY::could not be set"; exit 1; }
          token=$(printf '%s' "$INKLING_ADMIN_TOKEN" | tr -d '\r\n')
          printf '%s' "$token" | npx wrangler secret put ADMIN_TOKEN -c wrangler.openrouter-free.jsonc > /dev/null 2>&1 || { echo "::error title=ADMIN_TOKEN::could not be set"; exit 1; }
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$url/admin/summary" -H "Authorization: Bearer $token")
            [ "$code" = 200 ] && break; sleep 4
          done
          [ "$code" = 200 ] || { echo "::error title=Admin token::admin API answers $code"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Test AI server (OpenRouter Free)::$url; production untouched"

      - name: Security checks
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          ADMIN=$(printf '%s' "$INKLING_ADMIN_TOKEN" | tr -d '\r\n')
          curl -sS -X POST "$URL/admin/pause" -H "Authorization: Bearer $ADMIN" -H 'content-type: application/json' -d '{"paused":false}' >/dev/null
          node scripts/abuse-check.mjs security "$URL" | tee test-results/security-free.txt

      - name: Real-model scenarios (quality, latency, reliability)
        if: (success() || failure()) && steps.deploy.outputs.url != ''
        shell: bash
        env:
          INKLING_BETA_URL: ${{ steps.deploy.outputs.url }}
          INKLING_LIVE_CLOUD: '1'
          INKLING_LIVE_UNIT: usd
        run: |
          set +e
          npm run test:live:cloud
          status=$?
          set -e
          [ -f test-results/live-cloud-qwen3.8-27b.md ] && mv test-results/live-cloud-qwen3.8-27b.md test-results/live-cloud-openrouter-free.md
          [ -f test-results/live-cloud-qwen3.8-27b.json ] && mv test-results/live-cloud-qwen3.8-27b.json test-results/live-cloud-openrouter-free.json
          ADMIN=$(printf '%s' "$INKLING_ADMIN_TOKEN" | tr -d '\r\n')
          echo "::notice title=Test AI server after the scenarios::$(curl -sS "$INKLING_BETA_URL/admin/summary" -H "Authorization: Bearer $ADMIN" | jq -c '{upstreamRequests, upstreamRequestLimit, answers, paused}')"
          exit $status

      - name: Request quota under concurrency (temporary Worker, quota 5)
        if: (success() || failure()) && steps.deploy.outputs.url != ''
        working-directory: beta-server
        shell: bash
        env:
          NAME: inkling-ai-free-quota
        run: |
          ADMIN=$(printf '%s' "$INKLING_ADMIN_TOKEN" | tr -d '\r\n')
          export INKLING_ADMIN_TOKEN="$ADMIN"
          export OPENROUTER_API_KEY=$(printf '%s' "$OPENROUTER_API_KEY" | tr -d '\r\n')
          vars=(--name "$NAME" --var GLOBAL_REQUESTS_PER_DAY:5 --var GLOBAL_REQUESTS_PER_MINUTE:16 --var NETWORK_CONCURRENT:32 --var GLOBAL_CONCURRENT:32 --var NETWORK_PER_MINUTE:100)
          for attempt in 1 2 3; do
            npx wrangler deploy -c wrangler.openrouter-free.jsonc "${vars[@]}" > /tmp/q.log 2>&1 && break
            [ $attempt = 3 ] && { echo "::error title=Temporary server::$(tail -5 /tmp/q.log | tr '\n' ' ')"; exit 1; }; sleep 20
          done
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/q.log | head -1)
          printf '%s' "$OPENROUTER_API_KEY" | npx wrangler secret put INFERENCE_API_KEY --name "$NAME" > /dev/null 2>&1
          printf '%s' "$ADMIN" | npx wrangler secret put ADMIN_TOKEN --name "$NAME" > /dev/null 2>&1
          ok=0
          for i in $(seq 1 60); do
            got=$(curl -sS "$url/admin/summary" -H "Authorization: Bearer $ADMIN" | jq -c '[.upstreamRequestLimit, .limits.networkConcurrent]' 2>/dev/null || true)
            if [ "$got" = '[5,32]' ]; then ok=$((ok + 1)); else ok=0; fi
            [ $ok -ge 5 ] && break; sleep 3
          done
          [ $ok -ge 5 ] || { echo "::error title=Temporary server::not serving the tiny quota (got $got)"; exit 1; }
          sleep 10
          node scripts/quota-check.mjs "$url" 5 ../test-results/quota-check.md

      - name: Delete the temporary Worker
        if: always()
        shell: bash
        run: |
          res=$(curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/inkling-ai-free-quota?force=true")
          if [ "$(echo "$res" | jq -r .success)" = true ]; then echo "::notice title=Temporary Worker::deleted"; else echo "::warning title=Temporary Worker::$(echo "$res" | jq -c .errors)"; fi

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-server-free-reports
          path: |
            test-results/*.md
            test-results/*.json
            test-results/*.txt
          if-no-files-found: ignore
